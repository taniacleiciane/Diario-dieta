name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar a parte Android do projeto
        run: flutter create --platforms=android --org br.com.cleici --project-name lembrete_agua .

      - name: Ajustar permissões e notificações
        run: python3 tool/patch_android.py

      - name: Baixar dependências
        run: flutter pub get

      - name: Compilar o APK
        run: flutter build apk --release

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: lembrete-agua-apk
          path: build/app/outputs/flutter-apk/app-release.apk
